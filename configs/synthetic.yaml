extends: default.yaml

# No data needed: a seeded synthetic loan book. Used by tests, CI and as a 10-second demo.
dataset:
  adapter: synthetic
  options:
    n_rows: 20000
    n_months: 36
    base_bad_rate: 0.15

sample:
  min_issue_date: null

features:
  use_platform_rating: [false, true]   # the synthetic frame has an ordered `grade`, so both variants run

binning:
  sample_size: 20000

model:
  gbdt:                 # the default challenger (300 trees) is sized for 300k+ rows; on 12k training
    max_iter: 120       # rows it overfits (train-test KS gap > 0.05), so the demo uses a smaller one
    max_leaf_nodes: 6
    min_samples_leaf: 300

report:
  title: "Synthetic 评分卡报告（演示）"

output:
  dir: outputs/synthetic
